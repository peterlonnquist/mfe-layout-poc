# Bygger bara det som påverkats av ändringen och deployar varje påverkad app för sig.
#   Ändring i apps/huvudapplikation/**     -> bara huvudapplikation.
#   Ändring i libs/delat/layout/**         -> huvudapplikation (använder biblioteket från källkoden).
#                                             arenden och rapporter ligger i egna repon och tar in
#                                             en ny version av npm-paketet när de själva vill.
#   Ändring i apps/backend-for-frontend/** -> bara backend-for-frontend (menyn läses vid runtime).
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main] }

pool:
  vmImage: ubuntu-latest

variables:
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    NX_BASE: origin/main
  ${{ else }}:
    NX_BASE: HEAD~1

stages:
  - stage: Bygg
    jobs:
      - job: Bygg
        steps:
          - checkout: self
            fetchDepth: 0
          - task: NodeTool@0
            inputs: { versionSpec: '22.x' }
          - script: npm ci
            displayName: Installera beroenden
          - script: npx nx affected -t build --base=$(NX_BASE) --head=HEAD
            displayName: Bygg påverkade projekt
          - script: |
              APPAR=$(npx nx show projects --affected --type app --base=$(NX_BASE) --head=HEAD --json)
              # Konvention: huvudapplikation ligger på /, övriga på /<app>/ (samma som appBas() i layoutbiblioteket).
              # backend-for-frontend är en Node-tjänst utan bas-sökväg och med egen Dockerfile.
              MATRIS=$(node -e '
                const a = JSON.parse(process.argv[1]);
                const jobb = (x) => x === "backend-for-frontend"
                  ? { APP: x, BAS: "", DOCKERFILE: "deploy/backend-for-frontend/Dockerfile" }
                  : { APP: x, BAS: x === "huvudapplikation" ? "/" : `/${x}/`, DOCKERFILE: "deploy/app/Dockerfile" };
                console.log(JSON.stringify(Object.fromEntries(a.map(x => [x, jobb(x)]))));
              ' "$APPAR")
              echo "Påverkade appar: $APPAR"
              # Om bara backend-for-frontend påverkats finns inget byggt, men artefakten måste ändå finnas.
              mkdir -p dist/apps && touch dist/apps/.artefakt
              echo "##vso[task.setvariable variable=matris;isOutput=true]$MATRIS"
            name: paverkade
            displayName: Räkna ut påverkade appar
          - publish: dist/apps
            artifact: appar
            condition: and(succeeded(), ne(variables['paverkade.matris'], '{}'))

  - stage: Deploy
    dependsOn: Bygg
    condition: |
      and(succeeded(),
          ne(variables['Build.Reason'], 'PullRequest'),
          ne(dependencies.Bygg.outputs['Bygg.paverkade.matris'], '{}'))
    jobs:
      - job: Deploya
        strategy:
          # En jobbinstans per påverkad app -> oberoende deploy
          matrix: $[ stageDependencies.Bygg.Bygg.outputs['paverkade.matris'] ]
        steps:
          - checkout: self
          - download: current
            artifact: appar
          - script: |
              # backend-for-frontend har inget byggsteg och därmed inget i dist/.
              if [ -d "$(Pipeline.Workspace)/appar/$(APP)" ]; then
                mkdir -p dist/apps && cp -r $(Pipeline.Workspace)/appar/$(APP) dist/apps/
              fi
              echo "Deployar $(APP) på $(BAS)"
              # Container:   docker build -f $(DOCKERFILE) --build-arg APP=$(APP) --build-arg BAS=$(BAS) -t <acr>/$(APP):$(Build.BuildId) . && docker push ...
              # Statiskt:    az storage blob upload-batch -s dist/apps/$(APP)/browser -d '$web$(BAS)' --overwrite
            displayName: Deploya $(APP)
