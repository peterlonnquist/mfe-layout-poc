# Gatewayn är det enda som vet vilken app som bor på vilken sökväg.
# Alla appar delar därmed origin: inga CORS-problem, delad localStorage och cookies.
# Motsvarande regler kan ligga i Azure Front Door, Application Gateway eller en Kubernetes-ingress.
server {
  listen 80;

  # Om en app inte svarar visas en egen sida i stället för nginx standard-502.
  # Övriga appar påverkas inte.
  proxy_intercept_errors on;
  error_page 502 503 504 /_gateway/otillganglig.html;
  location = /_gateway/otillganglig.html {
    root /usr/share/nginx/html;
    internal;
    add_header Cache-Control "no-store" always;
  }

  location = /arenden   { return 301 /arenden/; }
  location = /rapporter { return 301 /rapporter/; }

  location /arenden/   { proxy_pass http://arenden; }
  location /rapporter/ { proxy_pass http://rapporter; }

  # Allt annat, inklusive /meny.json, går till start-appen.
  location / { proxy_pass http://start; }
}
