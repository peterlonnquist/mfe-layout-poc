# Kör de byggda apparna som separata containrar bakom en gateway, som i drift.
# arenden och rapporter ligger i egna repon bredvid det här (../mfe-arenden, ../mfe-rapporter)
# och måste vara byggda där först (npm run build i respektive repo).
#   npm run build && docker compose -f deploy/docker-compose.yml up --build
#   http://localhost:8080
services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/otillganglig.html:/usr/share/nginx/html/_gateway/otillganglig.html:ro
    ports: ['8080:80']
    depends_on: [backend-for-frontend, huvudapplikation, arenden, rapporter]
  backend-for-frontend:
    build: { context: .., dockerfile: deploy/backend-for-frontend/Dockerfile }
  huvudapplikation:
    build: { context: .., dockerfile: deploy/app/Dockerfile, args: { APP: huvudapplikation, BAS: / } }
  arenden:
    build: ../../mfe-arenden
  rapporter:
    build: ../../mfe-rapporter
